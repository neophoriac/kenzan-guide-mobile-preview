/* A persistent, in-flow warning; it never competes with the mobile tracker dock. */
#browser-storage-notice {
  position: sticky;
  inset-block-start: 0;
  z-index: 9;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem 1rem;
  padding: .6rem max(1rem, env(safe-area-inset-right)) .6rem max(1rem, env(safe-area-inset-left));
  border-block-end: 1px solid #aaa391;
  background: #f0e9dc;
  color: #252820;
  font: .875rem/1.45 'Source Sans 3', 'Segoe UI', sans-serif;
}
#browser-storage-notice[hidden] { display: none !important; }
#browser-storage-notice p { max-inline-size: 75ch; margin: 0; }
#browser-storage-notice button {
  flex: none;
  min-block-size: 2.75rem;
  padding: .35rem .7rem;
  border: 1px solid #7c332a;
  border-radius: .3rem;
  background: #fbf8f2;
  color: #7c332a;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
#browser-storage-notice button:hover { background: #fbf8f2; text-decoration: underline; text-underline-offset: .18em; }
#browser-storage-notice button:focus-visible { outline: 2px solid #7c332a; outline-offset: 3px; }
html[data-kenzan-storage-notice] { scroll-padding-top: calc(var(--storage-notice-height, 0px) + 1.5rem); }
html[data-kenzan-storage-notice] .layout > .sidebar-dock {
  top: var(--storage-notice-height, 0px);
  max-height: calc(100dvh - var(--storage-notice-height, 0px));
}
html[data-kenzan-storage-notice] .atlas-shell { --atlas-height: calc(100dvh - var(--storage-notice-height, 0px)); }
html[data-kenzan-storage-notice] #completion-compact:not([data-in-drawer]) {
  max-block-size: calc(100dvh - var(--storage-notice-height, 0px) - var(--compact-bottom) - max(.75rem, env(safe-area-inset-top)));
}
html[data-kenzan-storage-notice] .skip,
html[data-kenzan-storage-notice] .atlas-skip { top: calc(var(--storage-notice-height, 0px) + .5rem); }
@media (max-width: 32rem) {
  #browser-storage-notice { align-items: start; }
  #browser-storage-notice button { padding-inline: .5rem; }
}

  body { margin: 0; } [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  #view-status { margin: 1rem; font: 1rem system-ui; }</style>

<aside id="browser-storage-notice" hidden aria-label="Browser storage"><p role="status" aria-live="polite" data-storage-status></p><button type="button" data-storage-retry>Retry saving</button></aside>
